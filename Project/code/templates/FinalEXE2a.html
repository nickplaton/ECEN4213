

<html>
  <head>
    <!-- define your title  -->
    <title>ECEN4213 IoT</title>
    <style>
		body {
			text-align: center;
		}
    </style>
  </head>

  <body>

      <!-- image display module -->
      <h1>Live Streaming</h1>
      <img src="../static/img name.png" height="35%">

      <hr>

      <!-- sensor status display module -->
      <div>
        <!-- module 2 sensor tag: Bumper, wheelDrop, Cilff -->	
        <!-- sensor tag: Bumper, wheelDrop, Cilff -->
        <input style="font-size:40;height:150; width:300;" type = "button" id = "Bumper" value = "Bumper" />
        <!-- add two more buttons here -->
        <input style="font-size:40;height:150; width:300;" type = "button" id = "wheelDrop" value = "Wheel Drop" />
        <input style="font-size:40;height:150; width:300;" type = "button" id = "Cliff" value = "Cliff" />

      </div>

      <div>
        <!-- module 2 sensor status: on, off,… -->
        <input style="font-size:40;height:150; width:300;" type = "button" id = "state1" value = "Off" />
        <!-- add two more buttons here -->
        <input style="font-size:40;height:150; width:300;" type = "button" id = "state2" value = "Off" />
        <input style="font-size:40;height:150; width:300;" type = "button" id = "state3" value = "Off" />
      </div>
        


      <!-- D-pad module -->
      <div>
          <div>
            <!-- up button -->
          <input style="font-size:50;height:200px; width:200px;" type = "button" id = "upbutton" value = "Up" />
          
          </div>
          
          <div>
            <!-- left, stop and right button -->
          <input style="font-size:50;height:200px; width:200px;" type = "button" id = "leftbutton" value = "Left" />
          <!-- add two more buttons here -->
          <input style="font-size:50;height:200px; width:200px;" type = "button" id = "stopbutton" value = "Stop" />
          <input style="font-size:50;height:200px; width:200px;" type = "button" id = "rightbutton" value = "Right" />
        </div>
          
          <div>
          <!-- down button -->
          <input style="font-size:50;height:200px; width:200px;" type = "button" id = "downButton" value = "Down" />
          </div>
      </div>

  </body>
</html>
